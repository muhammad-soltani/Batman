services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batman-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - HF_HOME=/cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/cache/sentence_transformers
    volumes:
      - hf_cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      start_period: 180s
      interval: 20s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: batman-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:
