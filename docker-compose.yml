services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:9815
        HTTPS_PROXY: http://127.0.0.1:9815
    container_name: batman-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - HF_HOME=/cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/cache/sentence_transformers
    volumes:
      - hf_cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      start_period: 180s
      interval: 20s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: batman-frontend
    ports:
      - "3002:3002"
    restart: unless-stopped

volumes:
  hf_cache:
